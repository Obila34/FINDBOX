x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    logging: *default-logging
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: findbox
      POSTGRES_DB: findbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U findbox -d findbox"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    logging: *default-logging
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://findbox:${POSTGRES_PASSWORD}@db:5432/findbox
    command: [node, server/cli.mjs, migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    logging: *default-logging
    volumes:
      - print_exports:/app/private-exports
    build:
      context: .
      target: api
    environment:
      TRUSTED_PROXY: 172.30.77.10
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgres://findbox:${POSTGRES_PASSWORD}@db:5432/findbox
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your HTTPS domain}
      OPS_ORIGIN: ${OPS_ORIGIN:-}
      SCHOOL_ORIGIN: ${SCHOOL_ORIGIN:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      SUPPORT_ADMIN_IDS: ${SUPPORT_ADMIN_IDS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      COMPANY_EMAIL_CODES: ${COMPANY_EMAIL_CODES:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PASSWORD_B64: ${SMTP_PASSWORD_B64:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a base64 32-byte encryption key}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DARAJA_SANDBOX_CONSUMER_KEY: ${DARAJA_SANDBOX_CONSUMER_KEY:-}
      DARAJA_SANDBOX_CONSUMER_SECRET: ${DARAJA_SANDBOX_CONSUMER_SECRET:-}
      DARAJA_SANDBOX_SHORTCODE: ${DARAJA_SANDBOX_SHORTCODE:-}
      DARAJA_SANDBOX_PASSKEY: ${DARAJA_SANDBOX_PASSKEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gemma4:e2b-it-qat}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  # Self-hosted AI model for the company assistant. Private to the API: no published ports.
  # The API downloads the model on first start; the memory cap keeps FindBox itself safe.
  ollama:
    logging: *default-logging
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.11}
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY:-6g}
    cpus: ${OLLAMA_CPUS:-5}
    restart: unless-stopped
  web:
    logging: *default-logging
    build:
      context: .
      target: web
      args:
        OPS_ORIGIN: ${OPS_ORIGIN:-}
        SCHOOL_ORIGIN: ${SCHOOL_ORIGIN:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain}
      # Leave unset until DNS exists; the defaults are harmless local-only names.
      OPS_SITE_ADDRESS: ${OPS_SITE_ADDRESS:-http://ops.localhost}
      SCHOOL_SITE_ADDRESS: ${SCHOOL_SITE_ADDRESS:-http://school.localhost}
      OPS_ALLOWED_IPS: ${OPS_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    networks:
      default:
        ipv4_address: 172.30.77.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ollama_models:
  print_exports:
  postgres:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24
